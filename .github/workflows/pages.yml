name: Validate and deploy GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate PR+
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check required PWA files
        shell: bash
        run: |
          required_files=(
            pr-plus/index.html
            pr-plus/app.js
            pr-plus/data.mjs
            pr-plus/styles.css
            pr-plus/manifest.webmanifest
            pr-plus/version.json
            pr-plus/sw.js
            pr-plus/icons/icon-192.png
            pr-plus/icons/icon-512.png
            pr-plus/icons/apple-touch-icon.png
          )

          for file in "${required_files[@]}"; do
            test -s "$file" || {
              echo "Missing or empty required file: $file"
              exit 1
            }
          done

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < pr-plus/app.js
          node --check pr-plus/data.mjs
          node --check pr-plus/sw.js

      - name: Test data migrations and default routines
        run: node pr-plus/tests/migrations.mjs

      - name: Check web app metadata
        run: |
          python3 -m json.tool pr-plus/manifest.webmanifest > /dev/null
          python3 -m json.tool pr-plus/version.json > /dev/null

      - name: Check release metadata consistency
        shell: bash
        run: |
          app_version="$(python3 -c 'import json; print(json.load(open("pr-plus/version.json"))["appVersion"])')"
          release_id="$(python3 -c 'import json; print(json.load(open("pr-plus/version.json"))["releaseId"])')"
          schema_version="$(python3 -c 'import json; print(json.load(open("pr-plus/version.json"))["dataSchemaVersion"])')"
          grep -Fq "APP_VERSION = '$app_version';" pr-plus/data.mjs
          grep -Fq "DATA_SCHEMA_VERSION = $schema_version;" pr-plus/data.mjs
          for file in pr-plus/data.mjs pr-plus/sw.js; do
            grep -Fq "RELEASE_ID = '$release_id';" "$file"
          done

      - name: Require a new Service Worker cache version
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          if ! grep -Eq '^pr-plus/(index\.html|app\.js|data\.mjs|styles\.css|manifest\.webmanifest|version\.json|sw\.js|icons/)' <<< "$changed_files"; then
            exit 0
          fi

          if ! grep -qx 'pr-plus/sw.js' <<< "$changed_files" || ! grep -qx 'pr-plus/version.json' <<< "$changed_files"; then
            echo 'Cached PR+ files changed, but sw.js and version.json were not both updated.'
            echo 'Use a new releaseId in data.mjs, version.json, and sw.js before deployment.'
            exit 1
          fi

          previous_release="$(git show "$BASE_SHA:pr-plus/version.json" 2>/dev/null | python3 -c 'import json, sys; print(json.load(sys.stdin)["releaseId"])' 2>/dev/null || true)"
          current_release="$(python3 -c 'import json; print(json.load(open("pr-plus/version.json"))["releaseId"])')"

          if [ -z "$current_release" ]; then
            echo 'Could not read releaseId from pr-plus/version.json.'
            exit 1
          fi

          if [ -n "$previous_release" ] && [ "$previous_release" = "$current_release" ]; then
            echo "PR+ releaseId is still $current_release."
            echo 'Use a new releaseId so installed PWAs can detect and receive the update.'
            exit 1
          fi

      - name: Smoke-test static routes
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory . > /tmp/pr-plus-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/pr-plus/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              cat /tmp/pr-plus-http.log
              exit 1
            fi
            sleep 1
          done

          for asset in app.js data.mjs styles.css manifest.webmanifest version.json sw.js; do
            curl --fail --silent "http://127.0.0.1:8080/pr-plus/$asset" > /dev/null
          done

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
